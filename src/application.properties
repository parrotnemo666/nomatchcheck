# ==================== 新增：GVP 錄音檔檢查配置 ====================Nemo新增_20250528
# GVP 告警閾值（當異常記錄數量達到此值時觸發告警）
gvp.check.threshold=5

# GVP 錄音檔長度檢查標準（Record_GVP 欄位長度小於等於此值視為異常）
gvp.record.length.limit=83

# GVP 錄音檔長度檢查 SQL 查詢（完整語句）
gvp.sql.check.query=SELECT icr.CallUUID, icr.Flow_ID, icr.Record_GVP FROM [dbo].[IVR_Call_Records] as icr INNER JOIN [dbo].[IVR_Flow_Setting] as ifs ON icr.Flow_ID = ifs.Flow_ID WHERE icr.Begin_Time between(SELECT CONVERT(DATETIME,CONVERT(VARCHAR(10),GETDATE(),120))) and (SELECT DATEADD(SS,-1,DATEADD(DD,1,CONVERT(DATETIME,CONVERT(VARCHAR(10),GETDATE(),120))))) AND icr.End_Time is not null AND (ifs.Flow_Type = 'R' OR ifs.Flow_Type = 'O') AND LEN(icr.Record_GVP) <= ?

# GVP 告警訊息內容
